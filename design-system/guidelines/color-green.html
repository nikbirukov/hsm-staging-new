<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:64px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}.n{font-size:10px;font-weight:700;letter-spacing:.04em}.m{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}</style></head><body><div class="g"><div class="sw" style="background:var(--green-50)"><span class="n" style="color:var(--navy-800)">50</span></div><div class="sw" style="background:var(--green-100)"><span class="n" style="color:var(--navy-800)">100</span></div><div class="sw" style="background:var(--green-200)"><span class="n" style="color:var(--navy-800)">200</span></div><div class="sw" style="background:var(--green-300)"><span class="n" style="color:var(--navy-800)">300</span></div><div class="sw" style="background:var(--green-400)"><span class="n" style="color:#fff">400</span></div><div class="sw" style="background:var(--green-500)"><span class="n" style="color:#fff">500</span></div><div class="sw" style="background:var(--green-600)"><span class="n" style="color:#fff">600</span></div><div class="sw" style="background:var(--green-700)"><span class="n" style="color:#fff">700</span></div><div class="sw" style="background:var(--green-800)"><span class="n" style="color:#fff">800</span></div><div class="sw" style="background:var(--green-900)"><span class="n" style="color:#fff">900</span></div></div><div class="m" style="margin-top:10px">500 is the action colour · 600 hover · 700 press · 50 tint backgrounds</div></body></html>
