<!-- @dsCard group="Colors" viewport="700x140" name="Neutrals" subtitle="Surfaces, borders and dividers" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:64px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}.n{font-size:10px;font-weight:700;letter-spacing:.04em}.m{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}</style></head><body><div class="g"><div class="sw" style="background:var(--white);border:1px solid var(--border-subtle)"><span class="n" style="color:var(--navy-800)">white</span></div><div class="sw" style="background:var(--grey-25);border:1px solid var(--border-subtle)"><span class="n" style="color:var(--navy-800)">25</span></div><div class="sw" style="background:var(--grey-50);border:1px solid var(--border-subtle)"><span class="n" style="color:var(--navy-800)">50</span></div><div class="sw" style="background:var(--grey-100);border:1px solid var(--border-subtle)"><span class="n" style="color:var(--navy-800)">100</span></div><div class="sw" style="background:var(--grey-200);border:1px solid var(--border-subtle)"><span class="n" style="color:var(--navy-800)">200</span></div><div class="sw" style="background:var(--grey-300);border:1px solid var(--border-subtle)"><span class="n" style="color:var(--navy-800)">300</span></div><div class="sw" style="background:var(--grey-400);border:1px solid var(--border-subtle)"><span class="n" style="color:var(--navy-800)">400</span></div><div class="sw" style="background:var(--grey-500);border:1px solid var(--border-subtle)"><span class="n" style="color:#fff">500</span></div><div class="sw" style="background:var(--grey-600);border:1px solid var(--border-subtle)"><span class="n" style="color:#fff">600</span></div><div class="sw" style="background:var(--grey-700);border:1px solid var(--border-subtle)"><span class="n" style="color:#fff">700</span></div></div><div class="m" style="margin-top:10px">Cards are white on a --grey-50 page. Borders: --grey-200 hairline, --grey-300 on controls.</div></body></html>
