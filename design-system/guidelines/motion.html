<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:64px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}.n{font-size:10px;font-weight:700;letter-spacing:.04em}.m{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;font-size:12.5px">
<div style="padding:12px;background:var(--grey-50);border-radius:12px"><div class="m" style="color:var(--text-strong)">--dur-fast</div><div style="font-weight:700;margin-top:4px">150ms</div><div class="m" style="margin-top:2px">hover, focus, colour</div></div><div style="padding:12px;background:var(--grey-50);border-radius:12px"><div class="m" style="color:var(--text-strong)">--dur-base</div><div style="font-weight:700;margin-top:4px">220ms</div><div class="m" style="margin-top:2px">card lift, toggles</div></div><div style="padding:12px;background:var(--grey-50);border-radius:12px"><div class="m" style="color:var(--text-strong)">--dur-slow</div><div style="font-weight:700;margin-top:4px">380ms</div><div class="m" style="margin-top:2px">progress, sheets</div></div><div style="padding:12px;background:var(--grey-50);border-radius:12px"><div class="m" style="color:var(--text-strong)">--ease-standard</div><div style="font-weight:700;margin-top:4px">.2,.8,.2,1</div><div class="m" style="margin-top:2px">everything</div></div></div></body></html>
