<!-- @dsCard group="Colors" viewport="700x150" name="Inspection status" subtitle="Pass, fail, open action, N/A — never reassigned" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:64px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}.n{font-size:10px;font-weight:700;letter-spacing:.04em}.m{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
<div><div style="height:52px;background:var(--pass-500);border-radius:var(--radius-sm)"></div><div style="height:26px;background:var(--pass-50);border-radius:var(--radius-sm);margin-top:6px"></div><div class="n" style="margin-top:8px;color:var(--text-strong)">Pass</div><div class="m">--pass-500</div></div><div><div style="height:52px;background:var(--fail-500);border-radius:var(--radius-sm)"></div><div style="height:26px;background:var(--fail-50);border-radius:var(--radius-sm);margin-top:6px"></div><div class="n" style="margin-top:8px;color:var(--text-strong)">Fail</div><div class="m">--fail-500</div></div><div><div style="height:52px;background:var(--warn-500);border-radius:var(--radius-sm)"></div><div style="height:26px;background:var(--warn-50);border-radius:var(--radius-sm);margin-top:6px"></div><div class="n" style="margin-top:8px;color:var(--text-strong)">Open</div><div class="m">--warn-500</div></div><div><div style="height:52px;background:var(--info-500);border-radius:var(--radius-sm)"></div><div style="height:26px;background:var(--info-50);border-radius:var(--radius-sm);margin-top:6px"></div><div class="n" style="margin-top:8px;color:var(--text-strong)">Info</div><div class="m">--info-500</div></div><div><div style="height:52px;background:var(--na-500);border-radius:var(--radius-sm)"></div><div style="height:26px;background:var(--na-50);border-radius:var(--radius-sm);margin-top:6px"></div><div class="n" style="margin-top:8px;color:var(--text-strong)">N/A</div><div class="m">--na-500</div></div></div></body></html>
