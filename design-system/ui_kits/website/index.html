<body><div id="root"></div>
<script type="text/babel" src="SiteChrome.jsx"></script>
<script type="text/babel" src="HomeSections.jsx"></script>
<script type="text/babel" src="PricingSection.jsx"></script>
<script type="text/babel">
const { SiteHeader, SiteFooter, Hero, LogoWall, ProblemSection, FeatureSplit, ChecklistSection, Testimonials, StepsSection, FaqSection } = window;
function App(){
  const [page,setPage] = React.useState('home');
  return (<div>
    <SiteHeader page={page} onNav={setPage} />
    {page==='home' && <><Hero onNav={setPage}/><LogoWall/><ProblemSection/><FeatureSplit/><ChecklistSection/><Testimonials/><window.PricingSection onNav={setPage}/><StepsSection/><FaqSection/></>}
    {page==='pricing' && <window.PricingPage onNav={setPage}/>}
    <SiteFooter/>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
