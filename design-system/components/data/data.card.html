<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}.row:last-child{margin-bottom:0}.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);font-weight:700;width:100%;margin-bottom:-4px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { StatCard, DataTable, ChecklistRow, StatusPill, Card } = window.HSManagerDesignSystem_7bf991;
const rows=[{id:1,ref:'Racking Inspection · Aisle C',site:'Daventry DC',status:'fail'},{id:2,ref:'Forklift Pre-Start · FLT-08',site:'Rugby Hub',status:'pass'},{id:3,ref:'Weekly Fire Safety',site:'Manchester 2',status:'open'}];
function Demo(){const [v,setV]=React.useState('fail');
return (<div style={{display:'grid',gap:16}}>
<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
<StatCard label="Compliance score" value="94" unit="%" delta="+6 vs last month" icon="verified" />
<StatCard label="Inspections" value="128" delta="+18 this week" icon="assignment_turned_in" />
<StatCard label="Open actions" value="12" delta="4 overdue" deltaTone="down" icon="flag" />
</div>
<Card padding={0}><DataTable dense rows={rows} columns={[{key:'ref',header:'Report'},{key:'site',header:'Site'},{key:'status',header:'Status',align:'right',render:r=><StatusPill status={r.status} size="sm" />}]} /></Card>
<Card padding={0}><ChecklistRow index={4} question="Are all racking beams free of visible damage?" value={v} onChange={setV} photos={2} note="Beam damage at C-14, load removed and cordoned." /></Card>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
